[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "filesweep"
version = "1.0.0"
description = "Scan, summarize, and organize your files from the command line"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
filesweep = "filesweep.cli:main"

[tool.setuptools.packages.find]
where = ["."]
